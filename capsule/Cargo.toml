[package]
name = "hetao-capsule"
version = "0.3.13"
edition = "2021"

[dependencies]
tiny-skia = "0.11"
resvg = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tungstenite = "0.24"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    # 双显右列：GetSystemTimes / GlobalMemoryStatusEx 取本机 CPU/内存（请在 15 号追认）
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    # 安装器：SHBrowseForFolderW / BROWSEINFOW 选择安装目录
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Networking_WinSock",
    # 双显右列：GetIfTable2 取本机网卡累计收发字节，算电脑网络速率
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Media",
    "Win32_System_Com",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
codegen-units = 1
strip = true
