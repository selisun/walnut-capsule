[package]
name = "hetao-capsule"
version = "0.1.14"
edition = "2021"

[dependencies]
tiny-skia = "0.11"
ab_glyph = "0.2"
memmap2 = "0.9"
resvg = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tungstenite = "0.24"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Networking_WinSock",
    "Win32_Media",
    "Win32_System_Com",
] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
codegen-units = 1
strip = true
